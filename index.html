    <meta name="theme-color" content="#f6f5f1" />
    <script>
      // 外观（DEC-49）：首屏前应用本机偏好，避免闪烁；与 src/ui/theme.ts 同一规则
      ;(function () {
        var p = null
        try { p = localStorage.getItem('lh.theme') } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        if (p === 'light' || p === 'dark') document.documentElement.setAttribute('data-theme', p)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#262524' : '#f6f5f1')
      })()
    </script>
