<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="theme-color" content="#262524" media="(prefers-color-scheme: dark)" />
    <script>
      // 外观（DEC-49、#278）：首屏前应用本机偏好，避免闪烁；与 src/ui/theme.ts 同一规则
      // 本地 VITE_FAKE 预览未存过偏好时默认深色；线上默认跟随系统
      ;(function () {
        var p = null
        try { p = localStorage.getItem('lh.theme') } catch (e) {}
        var fake = '%VITE_FAKE_GITHUB%' === '1'
        if (p !== 'light' && p !== 'dark' && p !== 'system') p = fake ? 'dark' : null
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        if (p === 'light' || p === 'dark') document.documentElement.setAttribute('data-theme', p)
        var c = dark ? '#262524' : '#f6f5f1'
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c) })
      })()
    </script>
    <link rel="icon" href="/life-hundred-app/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/life-hundred-app/icon.svg" />

  <link rel="manifest" href="/life-hundred-app/manifest.webmanifest"></head>

</html>
